[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "herald-reader"
version = "0.1.0"
description = "A local-first research and news inbox"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
herald = "herald.cli:main"

[tool.setuptools.packages.find]
include = ["herald*"]

[tool.setuptools.package-data]
herald = ["static/*.html", "static/*.css", "static/*.js", "data/*.json"]
